<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Abriendo control de acceso…</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #344750;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(145deg, #fffdf7, #eef8fd);
    }
    .card {
      width: min(440px, 100%);
      padding: 30px;
      border: 1px solid rgba(183,144,63,.25);
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 18px 48px rgba(58,83,95,.12);
    }
    .loader {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border: 4px solid #dceef8;
      border-top-color: #6ea7c3;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="loader" aria-hidden="true"></div>
    <h1>Abriendo control de acceso</h1>
    <p>Serás dirigido al portal privado de registro QR.</p>
    <p><a id="manualLink" href="#">Continuar</a></p>
  </main>
  <script>
    "use strict";
    const TARGET_URL = <?!= JSON.stringify(scannerUrl || "") ?>;
    const link = document.getElementById("manualLink");
    link.href = TARGET_URL || "#";
    if (TARGET_URL) window.location.replace(TARGET_URL);
  </script>
</body>
</html>
