  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #3e4b53;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(145deg, #fffdf7, #eaf5fb 54%, #fff7d5);
    }
    main {
      width: min(460px, 100%);
      padding: 32px 26px;
      border: 1px solid rgba(199,164,91,.34);
      border-radius: 24px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 20px 55px rgba(74,102,117,.16);
    }
    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #dceef8;
      border-top-color: #6ea7c3;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    a { color: #497e9a; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="loader" aria-hidden="true"></div>
    <h1>Abriendo tu invitación</h1>
    <p>En un momento verás tu pase personalizado para el Baby Shower de Baby Paulo.</p>
    <p><a id="continueLink" href="./">Continuar a la invitación</a></p>
  </main>

  <script>
    "use strict";

    (function redirectToInvitation() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, "")
      );
      const code = String(
        hashParams.get("codigo") ||
        hashParams.get("code") ||
        params.get("codigo") ||
        params.get("code") ||
        ""
      )
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9-]/g, "")
        .slice(0, 24);

      const target = new URL("./", window.location.href);
      target.search = "";
      target.hash = "";

      if (code) {
        target.searchParams.set("codigo", code);
      }

      const link = document.getElementById("continueLink");
      if (link) link.href = target.toString();

      // Los rastreadores de vista previa normalmente no ejecutan JavaScript;
      // las personas sí son redirigidas a la invitación personalizada.
      window.setTimeout(function () {
        window.location.replace(target.toString());
      }, 120);
    }());
  </script>
</body>
